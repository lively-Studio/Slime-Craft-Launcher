name: Java CI

on:
  push:
  pull_request:
    paths-ignore:
      - '**.md'

# Version format: DEV{year}.{major}.{minor}-SNAPSHOT-{build}
# DEV     = Development version (开发版)
# 2026    = Development year (开发时间-年)
# 1       = First version of the year (该年第一版)
# 0       = No minor version info (没有小版本信息)
# SNAPSHOT = Advanced development build (高级开发版)
# 6       = Advanced build package version (高级开发版包版本号)
env:
  SCL_VERSION: DEV2026.1.0-SNAPSHOT-10

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'
        java-package: 'jdk+fx'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-cleanup: never

    - name: Clean old builds
      run: rm -rf SCL/build/libs/*

    - name: Prepare signing key
      env:
        SCL_SIGNATURE_KEY: ${{ secrets.SCL_SIGNATURE_KEY }}
      run: |
        if [ -n "$SCL_SIGNATURE_KEY" ]; then
          # Try base64-encoded DER first, fall back to PEM conversion
          echo "$SCL_SIGNATURE_KEY" | base64 -d > /tmp/scl_signature_key.pkcs8 2>/dev/null \
            || echo "$SCL_SIGNATURE_KEY" | openssl pkcs8 -topk8 -inform PEM -outform DER -nocrypt -out /tmp/scl_signature_key.pkcs8
          echo "SCL_SIGNATURE_KEY=/tmp/scl_signature_key.pkcs8" >> $GITHUB_ENV
          echo "Signing key prepared."
        else
          echo "Warning: SCL_SIGNATURE_KEY secret not set, JAR will not be signed."
        fi

    - name: Build with Gradle
      run: ./gradlew build --no-daemon --parallel
      env:
        MICROSOFT_AUTH_ID: ${{ secrets.MICROSOFT_AUTH_ID }}

    - name: Check if release already exists
      id: check_release
      run: |
        if gh release view "${{ env.SCL_VERSION }}" &>/dev/null; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "Release ${{ env.SCL_VERSION }} already exists, skipping upload."
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "Release ${{ env.SCL_VERSION }} not found, will upload."
        fi
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Upload JAR
      if: steps.check_release.outputs.exists == 'false'
      uses: actions/upload-artifact@v7
      with:
        name: SCL-${{ env.SCL_VERSION }}
        path: SCL/build/libs/SCL-*.jar
        archive: false

    - name: Generate release notes from CHANGELOG.md
      if: steps.check_release.outputs.exists == 'false'
      run: |
        # Extract the section for the current version from CHANGELOG.md
        # Format: "## DEV2026.1.0-SNAPSHOT-10" followed by bullet points until next "## "
        awk -v ver="${{ env.SCL_VERSION }}" '
          /^## / {
            if (found) exit
            if (index($0, ver)) { found=1; next }
          }
          found { print }
        ' CHANGELOG.md > release_notes.md

        # If no matching section was found, fall back to a simple message
        if [ ! -s release_notes.md ]; then
          echo "No changelog entry found for ${{ env.SCL_VERSION }}." > release_notes.md
        fi
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Create Release and Upload JAR
      if: steps.check_release.outputs.exists == 'false'
      run: |
        JAR=$(ls SCL/build/libs/SCL-*.jar | head -1)
        gh release create "${{ env.SCL_VERSION }}" "$JAR" \
          --title "${{ env.SCL_VERSION }}" \
          --notes-file release_notes.md
      env:
        GH_TOKEN: ${{ github.token }}

