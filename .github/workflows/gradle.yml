name: Java CI

on:
  push:
  pull_request:
    paths-ignore:
      - '**.md'

# Version format: DEV{year}.{major}.{minor}-SNAPSHOT-{build}
# DEV     = Development version (开发版)
# 2026    = Development year (开发时间-年)
# 1       = First version of the year (该年第一版)
# 0       = No minor version info (没有小版本信息)
# SNAPSHOT = Advanced development build (高级开发版)
# 3       = Advanced build package version (高级开发版包版本号)
env:
  SCL_VERSION: DEV2026.1.0-SNAPSHOT-3

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'
        java-package: 'jdk+fx'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-cleanup: never

    - name: Clean old builds
      run: rm -rf SCL/build/libs/*

    - name: Build with Gradle
      run: ./gradlew build --no-daemon --parallel
      env:
        MICROSOFT_AUTH_ID: ${{ secrets.MICROSOFT_AUTH_ID }}

    - name: Check if release already exists
      id: check_release
      run: |
        if gh release view "${{ env.SCL_VERSION }}" &>/dev/null; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "Release ${{ env.SCL_VERSION }} already exists, skipping upload."
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "Release ${{ env.SCL_VERSION }} not found, will upload."
        fi
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Upload JAR
      if: steps.check_release.outputs.exists == 'false'
      uses: actions/upload-artifact@v7
      with:
        name: SCL-${{ env.SCL_VERSION }}
        path: SCL/build/libs/SCL-*.jar
        archive: false

    - name: Generate release notes
      if: steps.check_release.outputs.exists == 'false'
      run: |
        # Find the previous release tag (DEV or V prefix)
        PREV_TAG=$(git tag --list 'DEV*' 'V*' --sort=-version:refname | grep -v "${{ env.SCL_VERSION }}" | head -1)
        if [ -n "$PREV_TAG" ]; then
          COMMIT_COUNT=$(git rev-list --count ${PREV_TAG}..HEAD)
          COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:'· %s' --reverse)
        else
          COMMIT_COUNT=$(git rev-list --count HEAD)
          COMMITS=$(git log --pretty=format:'· %s' --reverse)
        fi

        # Build release notes
        echo "> ⚠️ 警告！" > release_notes.md
        echo "> 这个版本是 **GitHub Actions 自动构建** 的产物，可能不准确！" >> release_notes.md
        echo "" >> release_notes.md
        echo "修复和更改了 **${COMMIT_COUNT}** 个提交：" >> release_notes.md
        echo "" >> release_notes.md
        echo "${COMMITS}" >> release_notes.md
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Create Release and Upload JAR
      if: steps.check_release.outputs.exists == 'false'
      run: |
        JAR=$(ls SCL/build/libs/SCL-*.jar | head -1)
        gh release create "${{ env.SCL_VERSION }}" "$JAR" \
          --title "${{ env.SCL_VERSION }}" \
          --notes-file release_notes.md
      env:
        GH_TOKEN: ${{ github.token }}

