name: Build Linux Packages

# 使用 jpackage 将 SCL 打包为 Linux .deb 与 .rpm 安装包
# - 在 ubuntu-latest（x86_64）上运行
# - x86_64 包：直接用宿主 JDK jpackage
# - aarch64 包：先下载 Zulu JDK 17 Linux aarch64，用宿主 jlink 指向其 jmods
#   交叉生成 aarch64 runtime image，再通过 jpackage --runtime-image 产出 arm64 安装包

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'

env:
  SCL_VERSION: DEV2026.1.0-SNAPSHOT-12
  ZULU_JDK_VERSION: '17'
  # Zulu FX JDK download URL template (buckle download endpoint + exact version)
  # Version suffix is resolved at download time via "latest in 17 LTS" for each platform/arch
  ZULU_BASE: 'https://cdn.azul.com/zulu/bin'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            cross: false
          - arch: aarch64
            cross: true
            zulu_arch: aarch64
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install jpackage native deps
        run: |
          sudo apt-get update
          # dpkg-deb 由 dpkg 提供，Ubuntu 默认已安装；只需补 fakeroot 与 rpm
          sudo apt-get install -y fakeroot rpm

      - name: Set up JDK 17 with JavaFX (host x64)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ env.ZULU_JDK_VERSION }}
          java-package: 'jdk+fx'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never

      - name: Show jpackage version
        run: jpackage --version

      - name: Prepare signing key
        env:
          SCL_SIGNATURE_KEY: ${{ secrets.SCL_SIGNATURE_KEY }}
        run: |
          if [ -n "$SCL_SIGNATURE_KEY" ]; then
            # Try base64-encoded DER first, fall back to PEM conversion
            echo "$SCL_SIGNATURE_KEY" | base64 -d > /tmp/scl_signature_key.pkcs8 2>/dev/null \
              || echo "$SCL_SIGNATURE_KEY" | openssl pkcs8 -topk8 -inform PEM -outform DER -nocrypt -out /tmp/scl_signature_key.pkcs8
            echo "SCL_SIGNATURE_KEY=/tmp/scl_signature_key.pkcs8" >> $GITHUB_ENV
            echo "Signing key prepared."
          else
            echo "Warning: SCL_SIGNATURE_KEY secret not set, JAR will not be signed."
          fi

      - name: Build JAR with Gradle
        run: ./gradlew :SCL:shadowJar --no-daemon --parallel
        env:
          MICROSOFT_AUTH_ID: ${{ secrets.MICROSOFT_AUTH_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

      # ============== Cross-build: download target-arch Zulu FX JDK ==============
      - name: Download Zulu FX JDK 17 for ${{ matrix.arch }} (cross build)
        if: matrix.cross
        run: |
          set -e
          # 列出目录下最新的 Zulu FX JDK (jdk+fx) for linux aarch64
          # 用 buckle 提供的可预测链接：zulu17.x.y-zulu-fx-jdk17.0.x-linux_aarch64.tar.gz
          # 直接取 Zulu 17 最新可用构建：使用 Azul CDN 上常见文件链接
          DOWNLOAD_DIR="$HOME/zulu-target-jdk"
          mkdir -p "$DOWNLOAD_DIR"
          cd "$DOWNLOAD_DIR"

          # Try the well-known Zulu 17 latest release URLs (pick the first one that succeeds)
          # 实际链接需与 Azul 最新版本一致，失败时用 Azul JSON API 查找
          URLS=(
            "https://cdn.azul.com/zulu/bin/zulu17.56.15-ca-fx-jdk17.0.14-linux_aarch64.tar.gz"
            "https://cdn.azul.com/zulu/bin/zulu17.54.17-ca-fx-jdk17.0.13-linux_aarch64.tar.gz"
            "https://cdn.azul.com/zulu/bin/zulu17.52.19-ca-fx-jdk17.0.12-linux_aarch64.tar.gz"
          )
          TARBALL=""
          for u in "${URLS[@]}"; do
            echo "Trying $u ..."
            if curl -fSIL --retry 3 -o /dev/null "$u" 2>/dev/null; then
              TARBALL="$u"
              break
            fi
          done
          if [ -z "$TARBALL" ]; then
            echo "No fixed Zulu URL worked; falling back to latest aarch64 JDK+FX from Azul index."
            # Fallback: query Azul release JSON API for linux-aarch64 jdk17 with javafx bundled
            API_URL="https://api.azul.com/metadata/v1/zulu/packages?java_version=17&os=linux&arch=aarch64&archive_type=tar.gz&java_package_type=jdk&javafx_bundled=true&latest=true&release_status=ga"
            TARBALL=$(curl -fsSL "$API_URL" | grep -oE '"download_url":"[^"]+"' | head -1 | cut -d'"' -f4)
          fi
          if [ -z "$TARBALL" ]; then
            echo "Could not resolve Zulu FX JDK aarch64 download URL"
            exit 1
          fi
          echo "Downloading: $TARBALL"
          curl -fSL --retry 3 -o target-jdk.tar.gz "$TARBALL"
          tar xzf target-jdk.tar.gz
          rm target-jdk.tar.gz
          # 解压后通常包含单目录，定位 jmods 目录
          TARGET_JDK_HOME=$(find "$PWD" -maxdepth 2 -name "jmods" -type d | head -1 | xargs dirname)
          echo "TARGET_JDK_HOME=$TARGET_JDK_HOME" >> "$GITHUB_ENV"
          echo "TARGET_JDK_HOME resolved: $TARGET_JDK_HOME"
          ls "$TARGET_JDK_HOME/jmods" | head -5

      # ============== Common: JAR, icon, version, modules ==============
      - name: Prepare Linux icon (.png)
        run: |
          set -e
          mkdir -p SCL/build/icons
          ICON_SRC="SCL/src/main/resources/assets/img/icon.png"
          for cand in \
            "SCL/src/main/resources/assets/img/icon@8x.png" \
            "SCL/src/main/resources/assets/img/icon@4x.png" \
            "SCL/src/main/resources/assets/img/icon.png"; do
            if [ -f "$cand" ]; then
              ICON_SRC="$cand"
              break
            fi
          done
          echo "Using icon source: $ICON_SRC"
          cp "$ICON_SRC" SCL/build/icons/SCL.png
          ls -la SCL/build/icons/

      - name: Sanitize version
        id: ver
        run: |
          VERSION_RAW="${{ env.SCL_VERSION }}"
          APP_VERSION=$(echo "$VERSION_RAW" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION=$(echo "$VERSION_RAW" | grep -oE '[0-9]+\.[0-9]+' | head -1)
          fi
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION="1.0.0"
          fi
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $APP_VERSION"

      - name: Prepare jpackage input
        run: |
          set -e
          JAR=$(ls SCL/build/libs/SCL-*.jar | head -1)
          JAR_NAME=$(basename "$JAR")
          echo "Using JAR: $JAR_NAME"
          echo "JAR_NAME=$JAR_NAME" >> "$GITHUB_ENV"
          mkdir -p SCL/build/jpackage-input
          cp "$JAR" SCL/build/jpackage-input/

      # ============== Cross: jlink target runtime image ==============
      - name: Build target runtime image (jlink) for ${{ matrix.arch }}
        if: matrix.cross
        run: |
          set -e
          set -x
          # 决定 jmod 路径：交叉情况下只用目标 JDK 的 jmods（含 JavaFX）
          JMODS_DIR="$TARGET_JDK_HOME/jmods"
          # 导出运行时镜像（含 JavaFX）
          # jlink 是纯 Java 工具，可以在任何架构运行，只要 jmods 属于目标架构即可
          RUNTIME_DIR="$PWD/SCL/build/runtime-${{ matrix.arch }}"
          rm -rf "$RUNTIME_DIR"
          # 核心 JDK 模块 + JavaFX 模块 + SCL 需要的 JDK 模块（jdk.attach 等）
          MODULES=$(find "$JMODS_DIR" -maxdepth 1 -name '*.jmod' -printf '%f\n' \
            | sed 's/\.jmod$//' | tr '\n' ',' | sed 's/,$//')
          echo "jlink modules count: $(echo "$MODULES" | tr ',' '\n' | wc -l)"
          jlink \
            --module-path "$JMODS_DIR" \
            --add-modules "$MODULES" \
            --output "$RUNTIME_DIR" \
            --strip-debug \
            --no-man-pages \
            --no-header-files \
            --compress=2 \
            --strip-native-commands \
            --include-locales=en,zh,ja,es,ru,uk,de,fr,it,ko,pt,ar,hi,tr,pl,nl,sv
          ls "$RUNTIME_DIR/lib" | head
          echo "RUNTIME_DIR=$RUNTIME_DIR" >> "$GITHUB_ENV"

      # ============== Build packages ==============
      - name: Build DEB with jpackage (${{ matrix.arch }})
        run: |
          set -e
          set -x
          RUNTIME_ARG=""
          if [ -n "${{ env.RUNTIME_DIR }}" ]; then
            RUNTIME_ARG="--runtime-image ${{ env.RUNTIME_DIR }}"
          fi
          # jpackage 对 Linux deb 的 Architecture 字段由 runtime image 自动推断。
          # 注：--linux-deb-section 是 JDK 18+ 选项，JDK 17 不支持，故不使用。
          # shellcheck disable=SC2086
          jpackage \
            --type deb \
            --name "SCL" \
            --app-version "${{ steps.ver.outputs.app_version }}" \
            --vendor "lively-Studio" \
            --copyright "Copyright (C) 2025 lively-Studio" \
            --description "Slime Craft Launcher" \
            --input SCL/build/jpackage-input \
            --main-jar "$JAR_NAME" \
            --main-class studio.lively.scl.Main \
            --icon SCL/build/icons/SCL.png \
            --linux-menu-group "Game" \
            --linux-shortcut \
            --linux-deb-maintainer "lively-Studio <X_CODER_ocs_2026@126.com>" \
            $RUNTIME_ARG \
            --java-options '--add-opens=java.base/java.lang=ALL-UNNAMED' \
            --java-options '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED' \
            --java-options '--add-opens=java.base/jdk.internal.loader=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.base/com.sun.javafx.binding=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.base/com.sun.javafx.event=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.base/com.sun.javafx.runtime=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.base/javafx.beans.property=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/javafx.css=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/javafx.stage=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/javafx.scene=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/com.sun.glass.ui=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/com.sun.javafx.stage=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/com.sun.javafx.util=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/com.sun.prism=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.controls/com.sun.javafx.scene.control=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.controls/com.sun.javafx.scene.control.behavior=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/com.sun.javafx.tk.quantum=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.controls/javafx.scene.control.skin=ALL-UNNAMED' \
            --java-options '--add-opens=jdk.attach/sun.tools.attach=ALL-UNNAMED' \
            --java-options '--enable-native-access=ALL-UNNAMED' \
            --java-options '-Dhmcl.offline.auth.restricted=false' \
            --verbose
          ls -la *.deb

      - name: Fix DEB control dependencies (cross-arch libc6 suffix bug)
        run: |
          set -e
          set -x
          # jpackage (JDK 17) on a cross aarch64 build wrongly writes
          # "Depends: libc6:amd64" which is uninstallable on arm64 hosts.
          # Rewrite the Depends line to be architecture-agnostic (plain libc6)
          # so apt resolves the correct libc6:<host-arch>.
          DEB=$(ls scl_*.deb 2>/dev/null | head -1 || ls *.deb | head -1)
          [ -n "$DEB" ] || { echo "No DEB produced"; exit 1; }
          WORK="$(mktemp -d)"
          ORIG_DEPENDS=$(dpkg-deb -f "$DEB" Depends || true)
          echo "Original Depends: $ORIG_DEPENDS"
          dpkg-deb -R "$DEB" "$WORK"
          # Replace any libc6:<arch> (e.g. libc6:amd64) with plain libc6,
          # and drop the architecture suffix from any other :<arch> dep too.
          sed -i -E 's/libc6:[a-z0-9]+/libc6/g; s/([a-z0-9.+-]+):(amd64|arm64|i386|armhf)/\\1/g' "$WORK/DEBIAN/control"
          NEW_DEPENDS=$(grep -i '^Depends:' "$WORK/DEBIAN/control" || true)
          echo "Patched control: $NEW_DEPENDS"
          rm -f "$DEB"
          # Rebuild with identical permissions/ownership.
          dpkg-deb -b --root-owner-group "$WORK" "$DEB"
          rm -rf "$WORK"
          echo "Rebuilt DEB: $DEB"
          dpkg-deb -I "$DEB" | grep -i -E 'arch|depends'

      - name: Build RPM with jpackage (${{ matrix.arch }})
        run: |
          set -e
          set -x
          RUNTIME_ARG=""
          if [ -n "${{ env.RUNTIME_DIR }}" ]; then
            RUNTIME_ARG="--runtime-image ${{ env.RUNTIME_DIR }}"
          fi
          # shellcheck disable=SC2086
          jpackage \
            --type rpm \
            --name "SCL" \
            --app-version "${{ steps.ver.outputs.app_version }}" \
            --vendor "lively-Studio" \
            --copyright "Copyright (C) 2025 lively-Studio" \
            --description "Slime Craft Launcher" \
            --input SCL/build/jpackage-input \
            --main-jar "$JAR_NAME" \
            --main-class studio.lively.scl.Main \
            --icon SCL/build/icons/SCL.png \
            --linux-menu-group "Game" \
            --linux-shortcut \
            $RUNTIME_ARG \
            --java-options '--add-opens=java.base/java.lang=ALL-UNNAMED' \
            --java-options '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED' \
            --java-options '--add-opens=java.base/jdk.internal.loader=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.base/com.sun.javafx.binding=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.base/com.sun.javafx.event=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.base/com.sun.javafx.runtime=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.base/javafx.beans.property=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/javafx.css=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/javafx.stage=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/javafx.scene=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/com.sun.glass.ui=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/com.sun.javafx.stage=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/com.sun.javafx.util=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/com.sun.prism=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.controls/com.sun.javafx.scene.control=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.controls/com.sun.javafx.scene.control.behavior=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/com.sun.javafx.tk.quantum=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.controls/javafx.scene.control.skin=ALL-UNNAMED' \
            --java-options '--add-opens=jdk.attach/sun.tools.attach=ALL-UNNAMED' \
            --java-options '--enable-native-access=ALL-UNNAMED' \
            --java-options '-Dhmcl.offline.auth.restricted=false' \
            --verbose
          ls -la *.rpm

      - name: Inspect RPM requirements (cross-arch sanity check)
        run: |
          set -e
          set -x
          # Unlike DEB (which can hardcode "libc6:amd64"), RPM derives its
          # Requires from the package's own architecture via autoReq, so an
          # aarch64 RPM normally yields aarch64-correct deps. Still, verify
          # no x86-only / amd64-specific requirement slipped in (e.g. a stray
          # "x86-64" marker or an explicit amd64 glibc), and fail fast if so.
          RPM_FILE=$(ls scl-*.rpm 2>/dev/null | head -1 || ls *.rpm | head -1)
          [ -n "$RPM_FILE" ] || { echo "No RPM produced"; exit 1; }
          echo "=== RPM Requires for $RPM_FILE ==="
          rpm -qp --requires "$RPM_FILE" || true
          echo "=== Checking for cross-arch (x86-64 / amd64) misflags ==="
          if rpm -qp --requires "$RPM_FILE" 2>/dev/null | grep -E -i 'x86-64|amd64|\.x86_64' ; then
            echo "::error::RPM contains an x86-64/amd64-specific requirement on a ${{ matrix.arch }} build."
            echo "::error::This will break installation on ${{ matrix.arch }} hosts; fix the jpackage/rpm build."
            exit 1
          fi
          echo "RPM requirements look arch-clean for ${{ matrix.arch }}."

      - name: Rename packages with version + arch
        run: |
          set -e
          DEB=$(ls scl_*.deb 2>/dev/null | head -1 || ls *.deb | head -1)
          RPM=$(ls scl-*.rpm 2>/dev/null | head -1 || ls *.rpm | head -1)

          DEB_NEW="SCL-${{ env.SCL_VERSION }}-linux-${{ matrix.arch }}.deb"
          RPM_NEW="SCL-${{ env.SCL_VERSION }}-linux-${{ matrix.arch }}.rpm"
          [ -n "$DEB" ] && mv "$DEB" "$DEB_NEW"
          [ -n "$RPM" ] && mv "$RPM" "$RPM_NEW"
          ls -la "$DEB_NEW" "$RPM_NEW"
          echo "DEB_NEW=$DEB_NEW" >> "$GITHUB_ENV"
          echo "RPM_NEW=$RPM_NEW" >> "$GITHUB_ENV"

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v7
        with:
          name: SCL-${{ env.SCL_VERSION }}-linux-${{ matrix.arch }}-deb
          path: ${{ env.DEB_NEW }}
          archive: false

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: SCL-${{ env.SCL_VERSION }}-linux-${{ matrix.arch }}-rpm
          path: ${{ env.RPM_NEW }}
          archive: false

      - name: Upload packages to Release
        continue-on-error: true
        run: |
          if gh release view "${{ env.SCL_VERSION }}" &>/dev/null; then
            gh release upload "${{ env.SCL_VERSION }}" \
              "${{ env.DEB_NEW }}" "${{ env.RPM_NEW }}" --clobber
            echo "Uploaded Linux packages (${{ matrix.arch }}) to release ${{ env.SCL_VERSION }}"
          else
            echo "Release ${{ env.SCL_VERSION }} does not exist, skipping upload."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
