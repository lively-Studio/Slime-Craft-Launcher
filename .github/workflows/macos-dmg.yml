name: Build macOS DMG

# 使用 jpackage 将 SCL 打包为 macOS .dmg 安装包
# 产物架构跟随 runner：macos-14 = arm64，macos-13 = x86_64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'

env:
  SCL_VERSION: DEV2026.1.0-SNAPSHOT-6

jobs:
  build-macos-dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17 with JavaFX
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          java-package: 'jdk+fx'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never

      - name: Show jpackage version
        run: jpackage --version

      - name: Build JAR with Gradle
        run: ./gradlew :SCL:shadowJar --no-daemon --parallel
        env:
          MICROSOFT_AUTH_ID: ${{ secrets.MICROSOFT_AUTH_ID }}

      - name: Prepare macOS icon (.icns)
        run: |
          set -e
          mkdir -p SCL/build/icons

          # 选择可用的最高分辨率图标作为源
          ICON_SRC="SCL/src/main/resources/assets/img/icon.png"
          for candidate in \
            "SCL/src/main/resources/assets/img/icon@8x.png" \
            "SCL/src/main/resources/assets/img/icon@4x.png" \
            "SCL/src/main/resources/assets/img/icon@2x.png" \
            "SCL/src/main/resources/assets/img/icon.png"; do
            if [ -f "$candidate" ]; then
              ICON_SRC="$candidate"
              break
            fi
          done
          echo "Using icon source: $ICON_SRC"
          sips -g pixelWidth -g pixelHeight "$ICON_SRC"

          ICONSET="SCL/build/icons/SCL.iconset"
          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"

          # macOS .iconset 要求的文件名与尺寸
          # 格式: size:filename
          specs=(
            "16:icon_16x16.png"
            "32:icon_16x16@2x.png"
            "32:icon_32x32.png"
            "64:icon_32x32@2x.png"
            "128:icon_128x128.png"
            "256:icon_128x128@2x.png"
            "256:icon_256x256.png"
            "512:icon_256x256@2x.png"
            "512:icon_512x512.png"
            "1024:icon_512x512@2x.png"
          )
          for spec in "${specs[@]}"; do
            size="${spec%%:*}"
            name="${spec##*:}"
            sips -z "$size" "$size" "$ICON_SRC" --out "$ICONSET/$name" -s format png >/dev/null
          done

          iconutil -c icns "$ICONSET" -o SCL/build/icons/SCL.icns
          ls -la SCL/build/icons/

      - name: Build DMG with jpackage
        run: |
          set -e
          set -x

          JAR=$(ls SCL/build/libs/SCL-*.jar | head -1)
          JAR_NAME=$(basename "$JAR")
          echo "Using JAR: $JAR_NAME"

          # macOS bundle 版本号必须为纯数字加点号 (如 x.y.z)
          # 从 SCL_VERSION 中提取数字部分，例如 DEV2026.1.0-SNAPSHOT-6 -> 2026.1.0
          VERSION_RAW="${{ env.SCL_VERSION }}"
          APP_VERSION=$(echo "$VERSION_RAW" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION=$(echo "$VERSION_RAW" | grep -oE '[0-9]+\.[0-9]+' | head -1)
          fi
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION="1.0.0"
          fi
          echo "App version: $APP_VERSION"

          # 准备 jpackage 输入目录（只放入主 JAR）
          mkdir -p SCL/build/jpackage-input
          cp "$JAR" SCL/build/jpackage-input/

          # 调用 jpackage 生成 DMG
          # --main-jar 模式下 jpackage 会使用 jlink 创建运行时镜像
          # Zulu JDK+FX 自带 JavaFX jmods，会被自动打包进运行时
          # --add-opens 与 manifest 中的 Add-Opens 保持一致（jpackage 启动器不以 -jar 方式启动，不会读取 manifest 的 Add-Opens）
          jpackage \
            --type dmg \
            --name "SCL" \
            --app-version "$APP_VERSION" \
            --vendor "lively-Studio" \
            --copyright "Copyright (C) 2025 lively-Studio" \
            --description "Slime Craft Launcher" \
            --input SCL/build/jpackage-input \
            --main-jar "$JAR_NAME" \
            --main-class studio.lively.scl.Main \
            --icon SCL/build/icons/SCL.icns \
            --mac-package-name "SCL" \
            --mac-package-identifier "studio.lively.scl" \
            --mac-app-category "public.app-category.games" \
            --java-options '--add-opens=java.base/java.lang=ALL-UNNAMED' \
            --java-options '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED' \
            --java-options '--add-opens=java.base/jdk.internal.loader=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.base/com.sun.javafx.binding=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.base/com.sun.javafx.event=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.base/com.sun.javafx.runtime=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.base/javafx.beans.property=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/javafx.css=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/javafx.stage=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/javafx.scene=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/com.sun.glass.ui=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/com.sun.javafx.stage=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/com.sun.javafx.util=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/com.sun.prism=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.controls/com.sun.javafx.scene.control=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.controls/com.sun.javafx.scene.control.behavior=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/com.sun.javafx.tk.quantum=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.controls/javafx.scene.control.skin=ALL-UNNAMED' \
            --java-options '--add-opens=jdk.attach/sun.tools.attach=ALL-UNNAMED' \
            --java-options '--enable-native-access=ALL-UNNAMED' \
            --java-options '-Dhmcl.offline.auth.restricted=false' \
            --verbose

          ls -la *.dmg

      - name: Rename DMG with arch suffix
        run: |
          set -e
          DMG=$(ls SCL-*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            DMG=$(ls *.dmg | head -1)
          fi
          NEW_NAME="SCL-${{ env.SCL_VERSION }}-macos-${{ matrix.arch }}.dmg"
          mv "$DMG" "$NEW_NAME"
          echo "Renamed to: $NEW_NAME"
          ls -la "$NEW_NAME"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: SCL-${{ env.SCL_VERSION }}-macos-${{ matrix.arch }}
          path: SCL-${{ env.SCL_VERSION }}-macos-${{ matrix.arch }}.dmg
          archive: false

      - name: Upload DMG to Release
        continue-on-error: true
        run: |
          if gh release view "${{ env.SCL_VERSION }}" &>/dev/null; then
            gh release upload "${{ env.SCL_VERSION }}" \
              "SCL-${{ env.SCL_VERSION }}-macos-${{ matrix.arch }}.dmg" --clobber
            echo "Uploaded DMG to release ${{ env.SCL_VERSION }}"
          else
            echo "Release ${{ env.SCL_VERSION }} does not exist, skipping upload."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
