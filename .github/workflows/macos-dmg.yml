name: Build macOS DMG

# 使用 jpackage 将 SCL 打包为 macOS .dmg 安装包
# - 统一在 macos-14 runner（Apple Silicon）上构建
# - arm64（Apple Silicon）：直接用宿主 JDK jpackage（产出本地架构 app）
# - x86_64（Intel）：先下载 Zulu FX JDK 17 macOS x64，用宿主 jlink 指向其 jmods
#   交叉生成 x86_64 runtime image，再通过 jpackage --runtime-image 产出 Intel 版 .app/.dmg
# 说明：GitHub 已在 2025 年逐步退役 macos-13 (Intel) hosted runner，因此 Intel 构建走交叉打包

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'

env:
  SCL_VERSION: DEV2026.1.0-SNAPSHOT-6
  ZULU_JDK_VERSION: '17'

jobs:
  build-macos-dmg:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            cross: false
          - arch: x86_64
            cross: true
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17 with JavaFX (host)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ env.ZULU_JDK_VERSION }}
          java-package: 'jdk+fx'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never

      - name: Show jpackage version
        run: jpackage --version

      - name: Build JAR with Gradle
        run: ./gradlew :SCL:shadowJar --no-daemon --parallel
        env:
          MICROSOFT_AUTH_ID: ${{ secrets.MICROSOFT_AUTH_ID }}

      # ============== Cross: download target-arch Zulu FX JDK tar.gz ==============
      - name: Download Zulu FX JDK 17 for macOS ${{ matrix.arch }} (cross build)
        if: matrix.cross
        run: |
          set -e
          DOWNLOAD_DIR="$HOME/zulu-target-jdk-macos"
          mkdir -p "$DOWNLOAD_DIR"
          cd "$DOWNLOAD_DIR"

          # macOS x64 JDK+FX 已知版本
          URLS=(
            "https://cdn.azul.com/zulu/bin/zulu17.56.15-ca-fx-jdk17.0.14-macosx_x64.tar.gz"
            "https://cdn.azul.com/zulu/bin/zulu17.54.17-ca-fx-jdk17.0.13-macosx_x64.tar.gz"
            "https://cdn.azul.com/zulu/bin/zulu17.52.19-ca-fx-jdk17.0.12-macosx_x64.tar.gz"
          )
          TARBALL=""
          for u in "${URLS[@]}"; do
            echo "Trying $u ..."
            if curl -fSIL --retry 3 -o /dev/null "$u" 2>/dev/null; then
              TARBALL="$u"
              break
            fi
          done
          if [ -z "$TARBALL" ]; then
            echo "No fixed Zulu URL worked; querying Azul metadata API."
            API_URL="https://api.azul.com/metadata/v1/zulu/packages?java_version=17&os=macos&arch=x64&archive_type=tar.gz&java_package_type=jdk&javafx_bundled=true&latest=true&release_status=ga"
            TARBALL=$(curl -fsSL "$API_URL" | grep -oE '"download_url":"[^"]+"' | head -1 | cut -d'"' -f4)
          fi
          if [ -z "$TARBALL" ]; then
            echo "Could not resolve Zulu FX JDK macOS-x64 download URL"
            exit 1
          fi
          echo "Downloading: $TARBALL"
          curl -fSL --retry 3 -o target-jdk.tar.gz "$TARBALL"
          tar xzf target-jdk.tar.gz
          rm target-jdk.tar.gz
          # 解压后通常 zulu-17.jdk/Contents/Home/jmods 或根下直出 jdk-... 目录
          TARGET_JDK_HOME=$(find "$PWD" -maxdepth 4 -name "jmods" -type d | head -1 | xargs dirname)
          echo "TARGET_JDK_HOME=$TARGET_JDK_HOME" >> "$GITHUB_ENV"
          echo "TARGET_JDK_HOME resolved: $TARGET_JDK_HOME"
          ls "$TARGET_JDK_HOME/jmods" | head -5

      # ============== Common: icon, version, jpackage input ==============
      - name: Prepare macOS icon (.icns)
        run: |
          set -e
          mkdir -p SCL/build/icons

          # 选择可用的最高分辨率图标作为源
          ICON_SRC="SCL/src/main/resources/assets/img/icon.png"
          for candidate in \
            "SCL/src/main/resources/assets/img/icon@8x.png" \
            "SCL/src/main/resources/assets/img/icon@4x.png" \
            "SCL/src/main/resources/assets/img/icon@2x.png" \
            "SCL/src/main/resources/assets/img/icon.png"; do
            if [ -f "$candidate" ]; then
              ICON_SRC="$candidate"
              break
            fi
          done
          echo "Using icon source: $ICON_SRC"
          sips -g pixelWidth -g pixelHeight "$ICON_SRC"

          ICONSET="SCL/build/icons/SCL.iconset"
          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"

          # macOS .iconset 要求的文件名与尺寸
          # 格式: size:filename
          specs=(
            "16:icon_16x16.png"
            "32:icon_16x16@2x.png"
            "32:icon_32x32.png"
            "64:icon_32x32@2x.png"
            "128:icon_128x128.png"
            "256:icon_128x128@2x.png"
            "256:icon_256x256.png"
            "512:icon_256x256@2x.png"
            "512:icon_512x512.png"
            "1024:icon_512x512@2x.png"
          )
          for spec in "${specs[@]}"; do
            size="${spec%%:*}"
            name="${spec##*:}"
            sips -z "$size" "$size" "$ICON_SRC" --out "$ICONSET/$name" -s format png >/dev/null
          done

          iconutil -c icns "$ICONSET" -o SCL/build/icons/SCL.icns
          ls -la SCL/build/icons/

      - name: Sanitize version
        id: ver
        run: |
          VERSION_RAW="${{ env.SCL_VERSION }}"
          APP_VERSION=$(echo "$VERSION_RAW" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION=$(echo "$VERSION_RAW" | grep -oE '[0-9]+\.[0-9]+' | head -1)
          fi
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION="1.0.0"
          fi
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $APP_VERSION"

      - name: Prepare jpackage input + resolve JAR
        run: |
          set -e
          JAR=$(ls SCL/build/libs/SCL-*.jar | head -1)
          JAR_NAME=$(basename "$JAR")
          echo "Using JAR: $JAR_NAME"
          echo "JAR_NAME=$JAR_NAME" >> "$GITHUB_ENV"
          mkdir -p SCL/build/jpackage-input
          cp "$JAR" SCL/build/jpackage-input/

      # ============== Cross: jlink target runtime image ==============
      - name: Build target runtime image (jlink) for ${{ matrix.arch }}
        if: matrix.cross
        run: |
          set -e
          set -x
          JMODS_DIR="$TARGET_JDK_HOME/jmods"
          RUNTIME_DIR="$PWD/SCL/build/runtime-${{ matrix.arch }}"
          rm -rf "$RUNTIME_DIR"
          MODULES=$(find "$JMODS_DIR" -maxdepth 1 -name '*.jmod' -printf '%f\n' \
            | sed 's/\.jmod$//' | tr '\n' ',' | sed 's/,$//')
          echo "jlink modules count: $(echo "$MODULES" | tr ',' '\n' | wc -l)"
          # 在 arm64 macOS 上调用 arm64 jlink，传入 x64 jmods 生成 x64 runtime image
          jlink \
            --module-path "$JMODS_DIR" \
            --add-modules "$MODULES" \
            --output "$RUNTIME_DIR" \
            --strip-debug \
            --no-man-pages \
            --no-header-files \
            --compress=2 \
            --strip-native-commands \
            --include-locales=*,en,zh,zh_CN,zh_TW,ja,es,ru,uk,de,fr,it,ko,pt,ar,hi,tr,pl,nl,sv
          ls "$RUNTIME_DIR/Contents/Home/lib" 2>/dev/null | head || ls "$RUNTIME_DIR/lib" 2>/dev/null | head || true
          echo "RUNTIME_DIR=$RUNTIME_DIR" >> "$GITHUB_ENV"

      # ============== Build DMG with jpackage ==============
      - name: Build DMG with jpackage (${{ matrix.arch }})
        run: |
          set -e
          set -x
          RUNTIME_ARG=""
          if [ -n "${{ env.RUNTIME_DIR }}" ]; then
            RUNTIME_ARG="--runtime-image ${{ env.RUNTIME_DIR }}"
          fi

          # shellcheck disable=SC2086
          jpackage \
            --type dmg \
            --name "SCL" \
            --app-version "${{ steps.ver.outputs.app_version }}" \
            --vendor "lively-Studio" \
            --copyright "Copyright (C) 2025 lively-Studio" \
            --description "Slime Craft Launcher" \
            --input SCL/build/jpackage-input \
            --main-jar "$JAR_NAME" \
            --main-class studio.lively.scl.Main \
            --icon SCL/build/icons/SCL.icns \
            --mac-package-name "SCL" \
            --mac-package-identifier "studio.lively.scl" \
            --mac-app-category "public.app-category.games" \
            $RUNTIME_ARG \
            --java-options '--add-opens=java.base/java.lang=ALL-UNNAMED' \
            --java-options '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED' \
            --java-options '--add-opens=java.base/jdk.internal.loader=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.base/com.sun.javafx.binding=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.base/com.sun.javafx.event=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.base/com.sun.javafx.runtime=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.base/javafx.beans.property=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/javafx.css=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/javafx.stage=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/javafx.scene=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/com.sun.glass.ui=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/com.sun.javafx.stage=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/com.sun.javafx.util=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/com.sun.prism=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.controls/com.sun.javafx.scene.control=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.controls/com.sun.javafx.scene.control.behavior=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.graphics/com.sun.javafx.tk.quantum=ALL-UNNAMED' \
            --java-options '--add-opens=javafx.controls/javafx.scene.control.skin=ALL-UNNAMED' \
            --java-options '--add-opens=jdk.attach/sun.tools.attach=ALL-UNNAMED' \
            --java-options '--enable-native-access=ALL-UNNAMED' \
            --java-options '-Dhmcl.offline.auth.restricted=false' \
            --verbose

          ls -la *.dmg

      - name: Rename DMG with arch suffix
        run: |
          set -e
          DMG=$(ls SCL-*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            DMG=$(ls *.dmg | head -1)
          fi
          NEW_NAME="SCL-${{ env.SCL_VERSION }}-macos-${{ matrix.arch }}.dmg"
          mv "$DMG" "$NEW_NAME"
          echo "Renamed to: $NEW_NAME"
          ls -la "$NEW_NAME"
          echo "DMG_NEW=$NEW_NAME" >> "$GITHUB_ENV"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: SCL-${{ env.SCL_VERSION }}-macos-${{ matrix.arch }}
          path: ${{ env.DMG_NEW }}
          archive: false

      - name: Upload DMG to Release
        continue-on-error: true
        run: |
          if gh release view "${{ env.SCL_VERSION }}" &>/dev/null; then
            gh release upload "${{ env.SCL_VERSION }}" "${{ env.DMG_NEW }}" --clobber
            echo "Uploaded DMG (${{ matrix.arch }}) to release ${{ env.SCL_VERSION }}"
          else
            echo "Release ${{ env.SCL_VERSION }} does not exist, skipping upload."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
